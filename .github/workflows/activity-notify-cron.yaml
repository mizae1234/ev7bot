name: Activity Notify Cron

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  check-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Call Activity Notify API
        run: |
          echo "🔔 Checking for new activity at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.APP_URL }}/api/cron/activity-notify?secret=${{ secrets.CRON_SECRET }}" \
            --max-time 60)
          
          echo "Response status: $RESPONSE"
          
          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Activity notify failed with status $RESPONSE"
            exit 1
          fi
          
          echo "✅ Activity check completed"

      - name: Get full response (for logging)
        if: always()
        run: |
          curl -s "${{ secrets.APP_URL }}/api/cron/activity-notify?secret=${{ secrets.CRON_SECRET }}" \
            --max-time 60 | head -c 2000
