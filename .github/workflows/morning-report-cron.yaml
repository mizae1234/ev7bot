name: Morning Report Cron

on:
  schedule:
    # 08:30 Bangkok time (UTC+7) = 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send-morning-report:
    runs-on: ubuntu-latest
    steps:
      - name: Call Morning Report API
        run: |
          echo "🕗 Triggering morning report at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.APP_URL }}/api/cron/morning-report?secret=${{ secrets.CRON_SECRET }}" \
            --max-time 120)
          
          echo "Response status: $RESPONSE"
          
          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Morning report failed with status $RESPONSE"
            exit 1
          fi
          
          echo "✅ Morning report sent successfully"

      - name: Get full response (for logging)
        if: always()
        run: |
          curl -s "${{ secrets.APP_URL }}/api/cron/morning-report?secret=${{ secrets.CRON_SECRET }}" \
            --max-time 120 | head -c 2000
